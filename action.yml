---
# Description
#
# USAGE
#
# - uses: git-secrets/TBD
name: git-secrets
description: Run git secrets
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      with:
        repository: 'awslabs/git-secrets'
        ref: 'ad82d68ee924906a0401dfd48de5057731a9bc84' #v1.3.0
    - name: Install
      run: |
        make install
    - name: Scan
      run: |
         git secrets --scan $GITHUB_WORKSPACE
