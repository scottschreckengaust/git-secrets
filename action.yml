---
# Scan with git-secrets
#
# EXAMPLE USAGE
#
# - uses: awslabs/git-secrets
#   with:
#     checkout: true
#     fetch-depth: 0
#     ref: 'main'
#     scan-type: '--scan-history'
branding:
  color: 'orange'
  icon: 'activity'
description: Scan the repository history with git-secrets with register-aws
inputs:
  checkout:
    default: true
    description: 'If "true" will checkout, otherwise the GITHUB_WORKSPACE already checked out'
    required: false
    type: boolean
  fetch-depth:
    default: '0'
    description: 'The fetch-depth if `checkout` is "true", ignored otherwise'
    required: false
    type: string
  ref:
    default: 'main' # '5357e18bc27b42a827b6780564ea873a72ca1f01'
    description: 'The version, ref, or hash of awslabs/git-secrets to use'
    required: false
    type: string
  scan-type:
    default: '--scan-history'
    description: 'The type of scan'
    required: false
    type: choice
    options:
      - '--scan-history'
      - '--scan'
name: scan
runs:
  steps:
    - name: Setup environmental variables
      run: |
        # Setup environmental variables
        echo "GIT_SECRETS_REPOSITORY_PATH=$GITHUB_WORKSPACE/git-secrets-repository" >> "$GITHUB_ENV"
      shell: bash
    - run: |
        # DEBUG 1
        echo $GIT_SECRETS_REPOSITORY_PATH;
      shell: bash
    - name: Checkout awslabs/git-secrets
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      with:
        repository: 'awslabs/git-secrets'
        ref: ${{ inputs.ref }}
        path: ${{ env.GIT_SECRETS_REPOSITORY_PATH }}
    - run: |
        # DEBUG 2
        ls $GIT_SECRETS_REPOSITORY_PATH;
        cd $GIT_SECRETS_REPOSITORY_PATH;
        pwd
      shell: bash
    - env:
        PREFIX : ${{ runner.temp }}/git-secrets-prefix
        MANPREFIX: ${{ runner.temp }}/git-secrets-manprefix
      name: Make git-secrets
      run: |
        # Make git-secrets
        cd $GIT_SECRETS_REPOSITORY_PATH
        make install;
        cd $GITHUB_WORKSPACE
        rm -r -f $GIT_SECRETS_REPOSITORY_PATH
        echo "$PREFIX/bin/" >> "$GITHUB_PATH"
      shell: bash
    - if: inputs.checkout
      name: Checkout the repository to scan history
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      with:
        fetch-depth: ${{ inputs.fetch-depth }} # to scan history
    - name: Install git-secrets
      run: |
        # Install git-secrets
        echo $PATH
        echo "Install git-secrets"
        git-secrets --install
        echo "Register AWS"
        git-secrets --register-aws
        echo "List git-secrets"
        git-secrets --list
      shell: bash
    - name: Scan with git-secrets
      run: |
        # Scan with git-secrets
        echo "Scan with git-secrets"
        git-secrets ${{ inputs.scan-type }}
      shell: bash
  using: "composite"
